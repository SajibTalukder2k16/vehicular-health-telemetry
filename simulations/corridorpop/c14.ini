*.numEnb = 1
*.eNodeB[0].mobility.initialX = 3080.0m
*.eNodeB[0].mobility.initialY = 11941.5m

*.ue.servingNodeId = 1
*.ue.mobility.traceFile = "c14.bonnmotion"
sim-time-limit = 1309s
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 6160m
**.mobility.constraintAreaMaxY = 23883m

# X2 FULL MESH. Real tower layouts are not chains: the best server
# can jump between non-adjacent sites, and a chain leaves those
# handovers unwired, which fails late in a run as an empty X2
# address. The mesh is O(n^2), which is why --max-sites caps n.
*.x2Mesh = true
*.eNodeB[*].numX2Apps = 0
*.eNodeB[*].x2App[*].server.localPort = 5000 + ancestorIndex(1)
# >>> BEGIN generated by tools/gen_bgue_placement.py -- do not edit
# Background UEs sit within +/-1000 m of their own eNodeB. Without
# this they are placed off-geometry and the RMa path loss model  asserts.
*.eNodeB[0].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(2080.0m, 4080.0m)
*.eNodeB[0].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialY = uniform(10941.5m, 12941.5m)
# <<< END generated by tools/gen_bgue_placement.py
