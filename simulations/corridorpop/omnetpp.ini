# =====================================================================
# Corridor-population study (added 2026-10-22).
#
# 15 corridors stratified across the national coverage distribution
# (analysis/corridors/stratified.csv), each a 20 km straight drive through one
# operator's real tower field. Per-corridor geometry, trace, X2 chain and
# sim-time come from the generated <name>.ini fragments; everything below is
# held identical so the corridor is the only thing that varies.
#
# Purpose: the regime finding says admission control helps when a link is
# contention-limited and does little when it is coverage-limited. Both earlier
# case studies were coverage-limited, so the controller's real-world
# population was unknown. These runs classify a representative sample.
[General]
network = paperrebuild.simulations.corridorA.CorridorNet
repeat = 3
seed-set = ${repetition}
**.routingRecorder.enabled = false
**.vector-recording = false
*.configurator.config = xmldoc("../corridorA/demo.xml")

num-rngs = 5
**.rig.wearable.rng-0 = 1
**.rig.camera.rng-0 = 1
**.rig.obd.rng-0 = 1
**.rig.alarm.rng-0 = 1
**.bgUE[*].**.rng-0 = 2
**.channelModel[*].rng-0 = 3
**.rig.bleWearable.rng-0 = 4
**.rig.camLink.rng-0 = 4
**.rig.obdLink.rng-0 = 4
**.rig.edge.rng-0 = 4

**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
*.ue.mobility.typename = "BonnMotionMobility"
*.ue.mobility.nodeId = 0

**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.eNodeB*.cellularNic.phy.targetBler = 0.004
**.cellularNic.channelModel[0].scenario = "RURAL_MACROCELL"
**.cellularNic.channelModel[0].fixedLos = true
**.cellularNic.channelModel[0].shadowing = true
**.cellularNic.channelModel[0].fading = true
**.channelControl.pMax = 20mW
**.channelControl.sat = -104dBm
**.channelControl.alpha = 2
**.cellularNic.phy.enableHandover = true

*.ue.numApps = 1
*.ue.app[0].typename = "paperrebuild.apps.EdgeApp"
*.ue.app[0].destAddress = "server"
*.ue.app[0].destPort = 5000
*.server.numApps = 1
*.server.app[0].typename = "paperrebuild.apps.HealthServerApp"
*.server.app[0].localPort = 5000

*.rig.*.pduErrorRate = 0.01
*.rig.targetModule = "CorridorNet.ue.app[0]"
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.camera.messageLength = 60KiB
*.rig.camera.sendInterval = 0.5s
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
# Whether a corridor is "contention-limited" is only meaningful relative to
# an assumed background load, so sweep two levels and report the regime as a
# function of load rather than asserting one number.
#
# FIXED 2026-11-02. Until this date the three lines below were the whole
# background-load configuration, and they produced no background traffic at
# all: `startTimeUl` defaults to -1s and TrafficGeneratorBase.cc:73 schedules
# a first transmission only `if (startTime_[UL] >= 0.0)`. numBgUes bound
# correctly and instantiated 2 vs 20 bgUE modules, which is why the gap went
# unnoticed for so long -- the modules existed and did nothing, so every
# result before this date describes one active UE in an otherwise idle cell.
# See docs/CORRECTIONS_2026-10.md C13.
#
# Three settings are required and all three were missing. Compare against
# Simu5G's own working examples in simulations/nr/bgTraffic:
#   1. generator.typename -- the default is the abstract TrafficGeneratorBase.
#      It is functional here (its getAvgLoad() stub is only read when
#      computeAvgInterference is on, and that defaults to false), but Cbr is
#      the sanctioned path and is what the examples use.
#   2. startTimeUl -- without it nothing is ever scheduled.
#   3. bgUE[*].mobility.initialX/Y -- a BackgroundUe has no position tied to
#      its parent cell, so unplaced it lands off-geometry and the RMa model
#      aborts the run at t=0. Generated per corridor into the cNN.ini
#      fragments by tools/gen_bgue_placement.py.
#
# Cbr reads packetSizeUl and periodUl once at initialize, so each background
# UE draws its own fixed size and period from the distributions below and then
# holds them: per-UE heterogeneity, constant per UE. Mean offered load is
# (600B + 33B header) * 8 / 40ms ~= 127 kbps per UE, so the bgues=20 level is
# ~2.5 Mbps of uplink per cell against numBands=25 (5 MHz).
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = ${bgues=2,20}
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.typename = "TrafficGeneratorCbr"
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.startTimeUl = uniform(0s, 0.05s)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.packetSizeUl = intuniform(200B, 1000B)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(20ms, 60ms)

