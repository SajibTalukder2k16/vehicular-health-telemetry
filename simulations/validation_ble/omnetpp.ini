[General]

# ---- random-number stream separation (added 2026-10-15) -------------------
# Without this every module shares rng-0, so any factor that changes how many
# packets are transmitted shifts the global draw order and changes when the
# exponentially-spaced sensors fire. Measured on the de-confounded cells at
# seed 0, vitals generation spanned 1297-1427 (10%) and OBD 637-738 (16%)
# across cells that were supposed to differ only in link type -- so those
# comparisons were never paired. Separate streams make sensor generation
# depend only on its own events, which are factor-independent.
num-rngs = 5
# Sensor SOURCES get their own stream, separate from the rig's links and
# edge: BleLink's per-PDU error draws and the edge's volatile processingTime
# also consume randomness, so a factor that changes link type or processing
# would otherwise still shift when the sensors fire.
**.rig.wearable.rng-0 = 1
**.rig.camera.rng-0 = 1
**.rig.obd.rng-0 = 1
**.rig.alarm.rng-0 = 1
**.bgUE[*].**.rng-0 = 2                  # background traffic
**.channelModel[*].rng-0 = 3             # radio channel
**.rig.bleWearable.rng-0 = 4             # rig links and edge service
**.rig.camLink.rng-0 = 4
**.rig.obdLink.rng-0 = 4
**.rig.edge.rng-0 = 4
network = BleValidationNet
sim-time-limit = 300s
repeat = 10
seed-set = ${repetition}
**.src.sourceType = 0
**.src.startTime = uniform(0s, 0.1s)
**.vector-recording = false

# --- Unloaded latency: expect mean ~= CI/2 + one PDU round (~0.35ms) ---
# Published: notification latency is uniform over the connection interval;
# minimum CI 7.5ms (BLE spec); Gomez et al. 2012, Tosi et al. 2017.

[Config LatencyCI7_5]
description = "unloaded latency, CI=7.5ms -> expect ~3.9ms mean"
**.link.connectionInterval = 7.5ms
**.src.messageLength = 20B
**.src.sendInterval = exponential(1s)

[Config LatencyCI30]
description = "unloaded latency, CI=30ms -> expect ~15.4ms mean"
**.link.connectionInterval = 30ms
**.src.messageLength = 20B
**.src.sendInterval = exponential(1s)

[Config LatencyCI50]
description = "unloaded latency, CI=50ms -> expect ~25.4ms mean"
**.link.connectionInterval = 50ms
**.src.messageLength = 20B
**.src.sendInterval = exponential(1s)

# --- Saturation throughput: source offers ~1.6Mbps, link caps it ---
# Published app-layer maxima: BLE 4.0 ~236.7 kbps (Gomez et al. 2012);
# BLE 4.2 DLE 1M PHY ~780 kbps; BLE 5 2M PHY ~1.3-1.4 Mbps.

[Config ThroughputBLE40]
description = "BLE 4.0 saturation -> expect ~237 kbps"
**.link.connectionInterval = 50ms
**.link.maxPduPayload = 27B
**.link.queueCapacity = 1MiB
**.src.messageLength = 1KiB
**.src.sendInterval = 5ms

[Config ThroughputBLE42]
description = "BLE 4.2 DLE saturation -> expect ~780 kbps"
**.link.connectionInterval = 50ms
**.link.maxPduPayload = 251B
**.link.queueCapacity = 1MiB
**.src.messageLength = 1KiB
**.src.sendInterval = 5ms

[Config ThroughputBLE5_2M]
description = "BLE 5 2M PHY saturation -> expect ~1.4 Mbps"
**.link.connectionInterval = 50ms
**.link.maxPduPayload = 251B
**.link.bitrate = 2Mbps
**.link.ackAirTime = 40us
**.link.queueCapacity = 1MiB
**.src.messageLength = 1KiB
**.src.sendInterval = 5ms

# --- Error behavior: 10% PDU error rate degrades throughput ~10% ---

[Config PER10]
description = "BLE 4.2 with 10% PDU error rate -> expect ~700 kbps"
extends = ThroughputBLE42
**.link.pduErrorRate = 0.1

# --- Infeasibility documentation run: 60KB camera frames at 2Hz over BLE ---
# Offered load ~0.96 Mbps > BLE 4.2 capacity: queue must saturate and drop.
# This single run replaces the old thesis's 12 runaway-queue "scenarios".

[Config CameraOverBleInfeasible]
description = "60KiB @ ~2Hz over BLE 4.2 -> saturated link, steady drops"
**.link.connectionInterval = 50ms
**.link.queueCapacity = 256KiB
**.link.pduErrorRate = 0.01
**.src.sourceType = 2
**.src.messageLength = 60KiB
**.src.sendInterval = uniform(0.45s, 0.55s)
