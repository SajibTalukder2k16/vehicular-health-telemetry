[General]
network = paperrebuild.simulations.corridorA.CorridorNet
sim-time-limit = 922s
repeat = 30
seed-set = ${repetition}
**.routingRecorder.enabled = false
**.vector-recording = false

# ---- random-number stream separation (added 2026-10-15) -------------------
# Without this every module shares rng-0, so a policy that changes how many
# packets are transmitted shifts the global draw order and changes when the
# exponentially-spaced sensors fire -- the offered workload then differs
# between policies and the comparison is not paired. See
# docs/PILOT_CONDITIONS.md for the measured drift.
num-rngs = 5
# Sensor SOURCES get their own stream, separate from the rig's links and
# edge: BleLink's per-PDU error draws and the edge's volatile processingTime
# also consume randomness, so a factor that changes link type or processing
# would otherwise still shift when the sensors fire.
**.rig.wearable.rng-0 = 1
**.rig.camera.rng-0 = 1
**.rig.obd.rng-0 = 1
**.rig.alarm.rng-0 = 1
**.bgUE[*].**.rng-0 = 2                  # background traffic
**.channelModel[*].rng-0 = 3             # radio channel
**.rig.bleWearable.rng-0 = 4             # rig links and edge service
**.rig.camLink.rng-0 = 4
**.rig.obdLink.rng-0 = 4
**.rig.edge.rng-0 = 4


# Family B case study: rural Virginia highway segment (OSM extract near
# Gainesville/Haymarket, US-29/I-66 area), SUMO-routed ego vehicle.
#
# Tower positions come from 204 OpenCellID LTE cells in the bbox. Each
# [Config] below models ONE operator's sites, since a subscriber can only use
# one network; the per-operator site sets are generated by
#   tools/opencellid_towers.py --mcc 310 --mnc <code> --site-radius 200
# and each towers_va_*.ini carries an AUDIT block with the route's
# distance-to-nearest-site profile.
#
# The superseded towers_va.ini pooled all three operators and kept only the 8
# DENSEST clusters, which discarded 80 of 88 sites and manufactured a 7.8%
# "coverage gap". Config VaDriveLegacy8 retains it as an explicit
# site-selection sensitivity arm -- do not use it for headline results.

**.mobility.constraintAreaMinX = -100m
**.mobility.constraintAreaMinY = -100m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 10600m
**.mobility.constraintAreaMaxY = 7000m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

# ---- radio: rural macro, dynamic LOS; horizon 4.5km < 5km NLOS validity ----
**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.eNodeB*.cellularNic.phy.targetBler = 0.004
**.cellularNic.channelModel[0].scenario = "RURAL_MACROCELL"
**.cellularNic.channelModel[0].dynamicLos = true
**.cellularNic.channelModel[0].shadowing = true
**.cellularNic.channelModel[0].fading = true
**.channelControl.pMax = 20mW
**.channelControl.sat = -100dBm
**.channelControl.alpha = 2

# ---- UE: SUMO ego trace ----
*.ue.mobility.typename = "BonnMotionMobility"
*.ue.mobility.traceFile = "va_ego.bonnmotion"
*.ue.mobility.nodeId = 0
# initial attach (*.ue.servingNodeId) comes from the per-operator towers file

# ---- handover: X2 full mesh comes from the per-operator towers file ----
**.cellularNic.phy.enableHandover = true

*.configurator.config = xmldoc("./demo.xml")

# ---- applications ----
*.ue.numApps = 1
*.ue.app[0].typename = "paperrebuild.apps.EdgeApp"
*.ue.app[0].destAddress = "server"
*.ue.app[0].destPort = 5000
*.server.numApps = 1
*.server.app[0].typename = "paperrebuild.apps.HealthServerApp"
*.server.app[0].localPort = 5000

# ---- sensor rig ----
# BLE PDU error process active (~1% short-range PER; see docs/BLE_VALIDATION.md)
*.rig.*.pduErrorRate = 0.01
*.rig.targetModule = "CorridorNet.ue.app[0]"
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.camera.messageLength = 4KiB
*.rig.camera.sendInterval = 0.5s
*.rig.edge.processingTime = uniform(0.5ms, 2ms)

# ---- background load: light rural cells ----
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 2
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(1000m, 10000m)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialY = uniform(1200m, 6400m)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.packetSizeUl = intuniform(200B, 1000B)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(20ms, 60ms)

# ---- per-operator scenarios (headline results) ----
[Config VaDriveAtt]
description = "rural VA highway, AT&T sites (mcc310-mnc410), 41 sites"
include towers_va_att.ini

[Config VaDriveTmo]
description = "rural VA highway, T-Mobile sites (mcc310-mnc260), 42 sites"
include towers_va_tmo.ini

[Config VaDriveVzw]
description = "rural VA highway, Verizon sites (mcc311-mnc480), 40 sites"
include towers_va_vzw.ini

# ---- site-selection sensitivity arm: the superseded pooled/8-densest set ----
# Retained only to quantify how much of the published rural penalty was an
# artifact of keeping the 8 densest clusters out of 88. Not a headline result.
[Config VaDriveLegacy8]
description = "SUPERSEDED: 3 operators pooled, 8 densest clusters of 88"
include towers_va.ini
*.ue.servingNodeId = 8

# =====================================================================
# Site-reduction sensitivity (added 2026-10-07).
#
# The headline per-operator configs keep every site that is among the 2
# nearest anywhere on the route, verified by showing the route's
# distance-to-nearest-site profile is identical to the operator's full site
# set. That verifies COVERAGE GEOMETRY ONLY. Equal nearest-site distances do
# not establish equivalent interference, handover behaviour or delivery.
# These arms raise the serving rank so radio and application outcomes can be
# compared, not just geometry.
#
#   rank 2 (headline) = 23 sites, rank 3 = 25, rank 4 = 27, of 41 candidates.
[Config VaDriveAttK3]
description = "AT&T sites, serving rank 3 (25 sites) -- site-reduction sensitivity"
include towers_va_att_k3.ini

[Config VaDriveAttK4]
description = "AT&T sites, serving rank 4 (27 sites) -- site-reduction sensitivity"
include towers_va_att_k4.ini

# =====================================================================
# Controlled alarm study (added 2026-10-07).
#
# At the design alarm rate -- exponential(300 s) -- a 922 s drive yields ~3
# alarms, so the whole 30-run corpus gives 50-98 and Wilson intervals 12-20 pp
# wide. Alarm reliability is therefore unmeasurable in the primary runs. The
# primary configs KEEP the design rate; this arm raises it tenfold purely to
# gain statistical exposure, which is a sampling device and not a claim about
# how often patients raise alarms.
#
# stopTime also stops alarm generation one deadline (5 s) before the cutoff,
# so every generated alarm has a full budget to arrive and none is censored.
[Config VaDriveAttAlarm]
description = "AT&T sites, 10x alarm rate for statistical exposure"
include towers_va_att.ini
*.rig.alarm.sendInterval = exponential(30s)
*.rig.alarm.stopTime = 917s

# =====================================================================
# Video-class payload on the real corridor (added 2026-10-15).
#
# The headline corridor configs carry 4 KiB camera frames, which offer only
# ~66 kbps -- far below capacity, so an admission gate has nothing to manage
# and every policy behaves identically. The payload factor in Family A sweeps
# {4, 60} KiB, and 60 KiB is the regime where the camera-versus-vitals trade
# exists. These arms carry the controller comparison onto measured
# infrastructure rather than synthetic chains.
[Config VaDriveAttVideo]
description = "rural VA AT&T sites, 60 KiB video-class camera payload"
include towers_va_att.ini
*.rig.camera.messageLength = 60KiB
