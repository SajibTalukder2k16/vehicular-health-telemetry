[General]
network = HealthVehicleNet
sim-time-limit = 240s
**.routingRecorder.enabled = false
**.vector-recording = true

# playground: 10 km corridor (SUMO lane y can be slightly negative)
**.mobility.constraintAreaMinX = -50m
**.mobility.constraintAreaMinY = -50m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 6100m
**.mobility.constraintAreaMaxY = 600m
**.mobility.constraintAreaMaxZ = 0m

############### eNodeB / channel ################
**.mobility.initFromDisplayString = false
*.eNodeB1.mobility.initialX = 1500m
*.eNodeB1.mobility.initialY = 250m
*.eNodeB2.mobility.initialX = 4500m
*.eNodeB2.mobility.initialY = 250m
**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
# smoke test uses the stock example channel; Phase 3 enables shadowing/fading
**.cellularNic.channelModel[0].shadowing = false
**.cellularNic.channelModel[0].fading = false
**.eNodeB*.cellularNic.phy.targetBler = 0.004

############### UE mobility: SUMO corridor trace ################
*.ue.mobility.typename = "BonnMotionMobility"
*.ue.mobility.traceFile = "corridor6k.bonnmotion"
*.ue.mobility.nodeId = 0
*.ue.servingNodeId = 1

############### handover / X2 ################
**.cellularNic.phy.enableHandover = true
*.eNodeB*.numX2Apps = 1
*.eNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.eNodeB1.x2App[0].client.connectAddress = "eNodeB2%x2ppp0"
*.eNodeB2.x2App[0].client.connectAddress = "eNodeB1%x2ppp0"

############### IPv4 configurator ################
*.configurator.config = xmldoc("./demo.xml")

############### applications ################
*.ue.numApps = 1
*.ue.app[0].typename = "paperrebuild.apps.EdgeApp"
*.ue.app[0].destAddress = "server"
*.ue.app[0].destPort = 5000

*.server.numApps = 1
*.server.app[0].typename = "paperrebuild.apps.HealthServerApp"
*.server.app[0].localPort = 5000

############### sensor rig ################
*.rig.targetModule = "HealthVehicleNet.ue.app[0]"
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.camera.messageLength = 4KiB
*.rig.camera.sendInterval = 0.5s
*.rig.edge.processingTime = uniform(1ms, 5ms)

[Config Smoke]
description = "gate test: full chain with one handover-crossing drive"
