[General]
network = WifiValidationNet
sim-time-limit = 300s
repeat = 10
seed-set = ${repetition}
**.vector-recording = false

# Separate RNG streams, for the same reason as every other scenario here:
# the link's own error and backoff draws must not shift when the source fires.
num-rngs = 5
**.src.rng-0 = 1
**.link.rng-0 = 4

**.src.sourceType = 0
**.src.startTime = uniform(0s, 0.1s)

# ---------------------------------------------------------------------------
# Targets below are the DCF cycle computed from the same 802.11a/g timings the
# module uses: slot 9us, SIFS 16us, DIFS 34us, PHY header 20us, CWmin 15 (mean
# backoff 7.5 slots), MAC header+FCS 28 B, ACK 14 B. Throughput is
# payload*8/cycle. These are ANALYTIC targets, not fitted: the module must
# reproduce them without a throughput knob, which is the same bar BleLink was
# held to in docs/BLE_VALIDATION.md.
# ---------------------------------------------------------------------------

# --- Unloaded latency: one DCF cycle for a tiny frame ---
[Config LatencyUnloaded]
description = "20 B at exp(1s), exclusive medium -> expect ~0.169 ms mean"
**.src.messageLength = 20B
**.src.sendInterval = exponential(1s)

# --- Saturation throughput, the primary calibration anchor ---
[Config Throughput54_1500]
description = "54 Mbps PHY, 1500 B, ACK 24 Mbps -> expect ~30.9 Mb/s"
**.link.queueCapacity = 1MiB
**.src.messageLength = 1500B
**.src.sendInterval = 0.2ms

# --- Independent cross-check against a published worked example ---
# NetSim (TETCOS) models one AP and one station with a full queue, CWmin 15,
# 9 us slot, 1518 B frame, ACK at 6 Mbps, and reports ~28.9 Mb/s UDP for a
# 1450 B payload. Our analytic cycle for that configuration gives 29.36 Mb/s,
# so the module should land near 29 and within a few percent of 28.9.
[Config ThroughputNetSimRef]
description = "1450 B, ACK 6 Mbps -> analytic 29.4, NetSim reports 28.9 Mb/s"
**.link.queueCapacity = 1MiB
**.link.ackBitrate = 6Mbps
**.src.messageLength = 1450B
**.src.sendInterval = 0.2ms

# --- The reason this module exists: a shared indoor medium ---
# mediumBusyFraction is the fraction of time the channel is held by stations
# outside the model. At 0.5 the station defers half the time, so every cycle
# doubles and throughput halves. If this does not halve, the contention term
# is not doing what it claims.
[Config MediumBusy50]
description = "as Throughput54_1500 but medium 50% busy -> expect ~15.4 Mb/s"
extends = Throughput54_1500
**.link.mediumBusyFraction = 0.5

[Config MediumBusy80]
description = "medium 80% busy -> expect ~6.2 Mb/s"
extends = Throughput54_1500
**.link.mediumBusyFraction = 0.8

# --- Error behaviour: retries cost air time and backoff grows ---
[Config FER10]
description = "10% frame error rate -> below 0.9x error-free, backoff doubles"
extends = Throughput54_1500
**.link.frameErrorRate = 0.1

# --- The actual indoor workload, for scale ---
# 4 KiB camera frames at 2 Hz is ~65.5 kb/s against a ~30 Mb/s ceiling. This
# config exists to show the sensor link is nowhere near binding, which is why
# a WLAN sensor link is capacity-equivalent to the wired one at these
# payloads and why the interesting term is contention, not capacity.
[Config CameraOverWifi]
description = "4 KiB @ 2 Hz -> ~0.2% utilisation, delay ~ one cycle"
**.src.sourceType = 2
**.src.messageLength = 4KiB
**.src.sendInterval = uniform(0.45s, 0.55s)

# Same workload on a medium that is 80% occupied by the backhaul: the
# question an indoor WLAN sensor link actually raises.
[Config CameraOverWifiBusy80]
description = "4 KiB @ 2 Hz with the medium 80% busy"
extends = CameraOverWifi
**.link.mediumBusyFraction = 0.8
