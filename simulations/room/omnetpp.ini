[General]
network = RoomNet
sim-time-limit = 300s
repeat = 30
seed-set = ${repetition}
**.vector-recording = false

# ---- random-number stream separation (added 2026-10-15) -------------------
# Without this every module shares rng-0, so any factor that changes how many
# packets are transmitted shifts the global draw order and changes when the
# exponentially-spaced sensors fire. Measured on the de-confounded cells at
# seed 0, vitals generation spanned 1297-1427 (10%) and OBD 637-738 (16%)
# across cells that were supposed to differ only in link type -- so those
# comparisons were never paired. Separate streams make sensor generation
# depend only on its own events, which are factor-independent.
num-rngs = 5
# Sensor SOURCES get their own stream, separate from the rig's links and
# edge: BleLink's per-PDU error draws and the edge's volatile processingTime
# also consume randomness, so a factor that changes link type or processing
# would otherwise still shift when the sensors fire.
**.rig.wearable.rng-0 = 1
**.rig.camera.rng-0 = 1
**.rig.obd.rng-0 = 1
**.rig.alarm.rng-0 = 1
**.bgUE[*].**.rng-0 = 2                  # background traffic
**.channelModel[*].rng-0 = 3             # radio channel
**.rig.bleWearable.rng-0 = 4             # rig links and edge service
**.rig.camLink.rng-0 = 4
**.rig.obdLink.rng-0 = 4
**.rig.edge.rng-0 = 4


# 10m x 10m room
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 10m
**.mobility.constraintAreaMaxY = 10m
**.mobility.constraintAreaMaxZ = 3m
**.mobility.initFromDisplayString = false
*.edgeHost.mobility.typename = "StationaryMobility"
*.edgeHost.mobility.initialX = 3m
*.edgeHost.mobility.initialY = 5m
*.ap.mobility.typename = "StationaryMobility"
*.ap.mobility.initialX = 7m
*.ap.mobility.initialY = 5m

# WiFi MSDUs up to 2304B would not fit Ethernet at the AP bridge
**.wlan[0].mac.mtu = 1500B

############### applications ################
*.edgeHost.numApps = 1
*.edgeHost.app[0].typename = "paperrebuild.apps.EdgeApp"
*.edgeHost.app[0].destAddress = "cloud"
*.edgeHost.app[0].destPort = 5000

*.cloud.numApps = 1
*.cloud.app[0].typename = "paperrebuild.apps.HealthServerApp"
*.cloud.app[0].localPort = 5000

############### sensor rig ################
*.rig.targetModule = "RoomNet.edgeHost.app[0]"
*.rig.hasObd = false
*.rig.cameraLinkType = "WiredLink"
*.rig.camera.messageLength = 4KiB
*.rig.camera.sendInterval = 0.1s          # 10 fps as in the thesis design
*.rig.edge.processingTime = uniform(1ms, 5ms)

[Config Room24GHz]
description = "802.11n on 2.4 GHz backhaul"
*.edgeHost.wlan[0].opMode = "n(mixed-2.4Ghz)"
*.ap.wlan[0].opMode = "n(mixed-2.4Ghz)"
**.wlan[0].radio.bandName = "2.4 GHz"

[Config Room5GHz]
description = "802.11ac on 5 GHz backhaul"
*.edgeHost.wlan[0].opMode = "ac"
*.ap.wlan[0].opMode = "ac"
**.wlan[0].radio.bandName = "5 GHz (20 MHz)"

[Config Room5GHzCameraBle]
description = "documented-infeasible: 4KiB camera at 10fps over BLE"
extends = Room5GHz
*.rig.cameraLinkType = "BleLink"

# =====================================================================
# Matched room configurations (added 2026-10-07).
#
# The Room* configs above are the indoor deployment as originally designed,
# but they are NOT comparable with the vehicular runs: 0.1 s camera interval
# against 0.5 s, uniform(1ms,5ms) edge processing against uniform(0.5ms,2ms),
# no OBD stream, and no BLE PDU error process. Quoting "7 ms indoors versus
# the vehicle" across that mismatch compares two different workloads.
#
# These configs hold the sensor rig identical to simulations/dc_case so the
# only difference between settings is the backhaul (WiFi against LTE).
[Config RoomMatchedBase]
*.rig.hasObd = true
*.rig.obdLinkType = "WiredLink"
*.rig.cameraLinkType = "WiredLink"
*.rig.camera.messageLength = 4KiB
*.rig.camera.sendInterval = 0.5s
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
*.rig.*.pduErrorRate = 0.01

[Config RoomMatched24GHz]
description = "matched to dc_case rig, 802.11n 2.4 GHz"
extends = RoomMatchedBase
*.edgeHost.wlan[0].opMode = "n(mixed-2.4Ghz)"
*.ap.wlan[0].opMode = "n(mixed-2.4Ghz)"
**.wlan[0].radio.bandName = "2.4 GHz"

[Config RoomMatched5GHz]
description = "matched to dc_case rig, 802.11ac 5 GHz"
extends = RoomMatchedBase
*.edgeHost.wlan[0].opMode = "ac"
*.ap.wlan[0].opMode = "ac"
**.wlan[0].radio.bandName = "5 GHz (20 MHz)"

# =====================================================================
# WLAN sensor links (added 2026-11-05).
#
# An indoor installation can put the camera on the wireless LAN rather than
# on a cable. The wearable stays on BLE in every configuration -- a body-worn
# device talks BLE indoors as well as in a vehicle -- so the camera is the
# stream that moves. `paperrebuild.links.WifiLink` is validated in
# docs/WIFI_VALIDATION.md.
#
# Two levels of the thing that is NOT just WiredLink renamed: indoor sensor
# and backhaul traffic share one medium. mediumBusyFraction is the share of
# time the channel is held by stations outside the sensor link. This
# application occupies ~0.2% of a 30 Mb/s link, so 0 is close to the truth
# for an otherwise idle WLAN; 0.8 is a deliberately hostile shared channel.
[Config RoomWifiCam]
description = "matched rig, camera on the WLAN, otherwise idle medium"
extends = RoomMatched5GHz
*.rig.cameraLinkType = "WifiLink"

[Config RoomWifiCamBusy80]
description = "camera on the WLAN with the medium 80% held by other stations"
extends = RoomWifiCam
*.rig.camLink.mediumBusyFraction = 0.8
