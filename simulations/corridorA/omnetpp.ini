[General]
network = CorridorNet
**.routingRecorder.enabled = false
**.vector-recording = false

# ---- random-number stream separation (added 2026-10-15) -------------------
# Without this every module shares rng-0, so any factor that changes how many
# packets are transmitted shifts the global draw order and changes when the
# exponentially-spaced sensors fire. Measured on the de-confounded cells at
# seed 0, vitals generation spanned 1297-1427 (10%) and OBD 637-738 (16%)
# across cells that were supposed to differ only in link type -- so those
# comparisons were never paired. Separate streams make sensor generation
# depend only on its own events, which are factor-independent.
num-rngs = 5
# Sensor SOURCES get their own stream, separate from the rig's links and
# edge: BleLink's per-PDU error draws and the edge's volatile processingTime
# also consume randomness, so a factor that changes link type or processing
# would otherwise still shift when the sensors fire.
**.rig.wearable.rng-0 = 1
**.rig.camera.rng-0 = 1
**.rig.obd.rng-0 = 1
**.rig.alarm.rng-0 = 1
**.bgUE[*].**.rng-0 = 2                  # background traffic
**.channelModel[*].rng-0 = 3             # radio channel
**.rig.bleWearable.rng-0 = 4             # rig links and edge service
**.rig.camLink.rng-0 = 4
**.rig.obdLink.rng-0 = 4
**.rig.edge.rng-0 = 4

repeat = 30
seed-set = ${repetition}

# ---- corridor geometry: eNodeB[i] at startX + i*ISD, vehicle drives from x=0 ----
# sim ends before the vehicle outruns the last cell (no out-of-coverage artifact)
**.mobility.constraintAreaMinX = -50m
**.mobility.constraintAreaMinY = -50m
**.mobility.constraintAreaMinZ = 0m
# covers the trace (26 km) plus bgUE spread around the last rural eNB (3 x 10 km)
**.mobility.constraintAreaMaxX = 32000m
**.mobility.constraintAreaMaxY = 600m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
*.eNodeB[*].mobility.initialY = 250m

# ---- radio ----
**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.eNodeB*.cellularNic.phy.targetBler = 0.004
**.cellularNic.channelModel[0].shadowing = true
**.cellularNic.channelModel[0].fading = true

# ---- UE mobility: SUMO trace selected by the speed factor ----
*.ue.mobility.typename = "BonnMotionMobility"
*.ue.mobility.nodeId = 0
*.ue.servingNodeId = 1

# ---- handover ----
**.cellularNic.phy.enableHandover = true
*.eNodeB[*].x2App[*].server.localPort = 5000 + ancestorIndex(1)

# ---- IPv4 ----
*.configurator.config = xmldoc("./demo.xml")

# ---- applications ----
*.ue.numApps = 1
*.ue.app[0].typename = "paperrebuild.apps.EdgeApp"
*.ue.app[0].destAddress = "server"
*.ue.app[0].destPort = 5000
*.server.numApps = 1
*.server.app[0].typename = "paperrebuild.apps.HealthServerApp"
*.server.app[0].localPort = 5000

# ---- sensor rig (payload/edge factors live in the Urban and Rural configs) ----
# BLE PDU error process active (~1% short-range PER; see docs/BLE_VALIDATION.md)
*.rig.*.pduErrorRate = 0.01
*.rig.targetModule = "CorridorNet.ue.app[0]"
*.rig.camera.sendInterval = 0.5s

# ---- background load factor: UEs per cell ----
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialY = uniform(50m, 450m)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.packetSizeUl = intuniform(200B, 1000B)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(20ms, 60ms)

# =====================================================================
[Config UrbanBase]
description = "urban macrocell, 4 eNBs; speed and ISD fully crossed"
*.numEnb = 4
**.cellularNic.channelModel[0].scenario = "URBAN_MACROCELL"
**.cellularNic.channelModel[0].dynamicLos = true
# delivery horizon 4.5km < 5km UMa validity
**.channelControl.pMax = 20mW
**.channelControl.sat = -100dBm
**.channelControl.alpha = 2
*.eNodeB[0].numX2Apps = 1
*.eNodeB[1].numX2Apps = 2
*.eNodeB[2].numX2Apps = 2
*.eNodeB[3].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"
*.eNodeB[1].x2App[1].client.connectAddress = "eNodeB[2]%x2ppp0"
*.eNodeB[2].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[2].x2App[1].client.connectAddress = "eNodeB[3]%x2ppp0"
*.eNodeB[3].x2App[0].client.connectAddress = "eNodeB[2]%x2ppp0"

[Config Urban]
extends = UrbanBase
*.rig.camera.messageLength = ${payload=4, 60}KiB
# edge type: embedded PC (wired sensors, faster service) vs smartphone (BLE sensors, slower service)
*.rig.cameraLinkType = ${camlink="WiredLink", "BleLink"}
*.rig.obdLinkType = ${obdlink="WiredLink", "BleLink" ! camlink}
*.rig.edge.processingTime = ${proc=uniform(0.5ms,2ms), uniform(2ms,8ms) ! camlink}
# ISD and speed factors (same speed levels as rural -> de-confounded)
# vehicle covers 3*ISD: passes 2-3 handover midpoints, never leaves coverage
*.eNodeB[*].mobility.initialX = ${isd=500,1000,2000}m / 2 + ancestorIndex(1) * ${isd}m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = ${bgues=0, 8, 20}
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * ${isd}m, (ancestorIndex(4)+1) * ${isd}m)
*.ue.mobility.traceFile = "speed${speed=30,55,80,105}.bonnmotion"
sim-time-limit = (3.0 * ${isd} / ${mps=8.33,15.28,22.22,29.17 ! speed} + 60) * 1s

# =====================================================================
[Config RuralBase]
description = "rural macrocell LOS, 3 eNBs, sparse sites"
*.numEnb = 3
**.cellularNic.channelModel[0].scenario = "RURAL_MACROCELL"
**.cellularNic.channelModel[0].dynamicLos = false
**.cellularNic.channelModel[0].fixedLos = true
# delivery horizon ~7km < 10km RMa LOS validity
**.channelControl.pMax = 20mW
**.channelControl.sat = -104dBm
**.channelControl.alpha = 2
*.eNodeB[0].numX2Apps = 1
*.eNodeB[1].numX2Apps = 2
*.eNodeB[2].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"
*.eNodeB[1].x2App[1].client.connectAddress = "eNodeB[2]%x2ppp0"
*.eNodeB[2].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"

[Config Rural]
extends = RuralBase
*.rig.camera.messageLength = ${payload=4, 60}KiB
# edge type: embedded PC (wired sensors, faster service) vs smartphone (BLE sensors, slower service)
*.rig.cameraLinkType = ${camlink="WiredLink", "BleLink"}
*.rig.obdLinkType = ${obdlink="WiredLink", "BleLink" ! camlink}
*.rig.edge.processingTime = ${proc=uniform(0.5ms,2ms), uniform(2ms,8ms) ! camlink}
*.eNodeB[*].mobility.initialX = ${isd=5000,10000}m / 2 + ancestorIndex(1) * ${isd}m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = ${bgues=0, 8, 20}
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * ${isd}m, (ancestorIndex(4)+1) * ${isd}m)
*.ue.mobility.traceFile = "speed${speed=30,55,80,105}.bonnmotion"
sim-time-limit = (2.0 * ${isd} / ${mps=8.33,15.28,22.22,29.17 ! speed} + 60) * 1s

# =====================================================================
# quick single-run smoke tests (fastest speed, one handover chain)
[Config UrbanSmoke]
extends = UrbanBase
repeat = 1
*.rig.camera.messageLength = 4KiB
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 2000m, (ancestorIndex(4)+1) * 2000m)
*.eNodeB[*].mobility.initialX = 1000m + ancestorIndex(1) * 2000m
*.ue.mobility.traceFile = "speed105.bonnmotion"
sim-time-limit = 267s

[Config RuralSmoke]
extends = RuralBase
repeat = 1
*.rig.camera.messageLength = 4KiB
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 0
*.eNodeB[*].mobility.initialX = 5000m + ancestorIndex(1) * 10000m
*.ue.mobility.traceFile = "speed105.bonnmotion"
sim-time-limit = 750s

# =====================================================================
# Phase-5 sensitivity analysis: bracket the channel-calibration uncertainty
# on representative cells (speed 55, bgues 8, wired rig, payload {4,60}).
# Variants: V0 baseline | V1 no shadowing | V2 no fading |
#           V3 6 dB vehicle penetration | V4 10 dB penetration
# (penetration emulated as symmetric tx-power cut, 3GPP TR 38.901 values)

[Config SensUrban]
extends = UrbanBase
repeat = 15
*.eNodeB[*].mobility.initialX = 500m + ancestorIndex(1) * 1000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 1000m, (ancestorIndex(4)+1) * 1000m)
*.ue.mobility.traceFile = "speed55.bonnmotion"
sim-time-limit = 257s
*.rig.camera.messageLength = ${spayload=4, 60}KiB
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
**.cellularNic.channelModel[0].shadowing = ${sshadow=true, false, true, true, true}
**.cellularNic.channelModel[0].fading = ${sfade=true, true, false, true, true ! sshadow}
**.ueTxPower = ${sue=26, 26, 26, 20, 16 ! sshadow}dBm
**.eNodeBTxPower = ${senb=40, 40, 40, 34, 30 ! sshadow}dBm

[Config SensRural]
extends = RuralBase
repeat = 15
*.eNodeB[*].mobility.initialX = 5000m + ancestorIndex(1) * 10000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 10000m, (ancestorIndex(4)+1) * 10000m)
*.ue.mobility.traceFile = "speed55.bonnmotion"
sim-time-limit = 1369s
*.rig.camera.messageLength = ${spayload=4, 60}KiB
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
**.cellularNic.channelModel[0].shadowing = ${sshadow=true, false, true, true, true}
**.cellularNic.channelModel[0].fading = ${sfade=true, true, false, true, true ! sshadow}
**.ueTxPower = ${sue=26, 26, 26, 20, 16 ! sshadow}dBm
**.eNodeBTxPower = ${senb=40, 40, 40, 34, 30 ! sshadow}dBm

# =====================================================================
# De-confounded edge-type factorial (added 2026-10-05).
#
# In [Config Rural] the camera link, the OBD link and the edge processing
# time all flip together via parallel iteration (`! camlink`), so the
# "smartphone vs embedded edge" effect conflates three changes and cannot be
# attributed to camera admission alone. This config crosses the three
# factors independently in the stressed cell (rural, 10 km ISD, 60 KiB
# camera frames) where the trade-off actually appears -- at 4 KiB the two
# edge types are indistinguishable.
#
# 2 x 2 x 2 x 30 seeds = 240 runs.
[Config RuralEdgeDeconf]
extends = RuralBase
repeat = 30
*.rig.camera.messageLength = 60KiB
*.rig.cameraLinkType = ${camlink="WiredLink", "BleLink"}
*.rig.obdLinkType = ${obdlink="WiredLink", "BleLink"}
*.rig.edge.processingTime = ${proc=uniform(0.5ms,2ms), uniform(2ms,8ms)}
*.eNodeB[*].mobility.initialX = 10000m / 2 + ancestorIndex(1) * 10000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 10000m, (ancestorIndex(4)+1) * 10000m)
*.ue.mobility.traceFile = "speed55.bonnmotion"
sim-time-limit = (2.0 * 10000 / 15.28 + 60) * 1s

# =====================================================================
# Buffer/frame-ratio sensitivity (added 2026-10-06).
#
# BleLink's default queueCapacity is 65536 B and the stressed camera frame is
# 61440 B, so one frame occupies 94% of the queue and the drop-tail test
# (queueBytes + 61440 > 65536) rejects every second frame while the first is
# still draining. At 60 KiB the link is therefore a one-frame-in-flight
# system, and the admission behaviour may be set by that ratio rather than by
# BLE bandwidth. This sweep separates the two: if the camera-link effect
# collapses as the buffer grows, the mechanism is buffer-driven.
#
# BLE only (WiredLink has no queueCapacity). The matched wired reference is
# the cam=wired/obd=wired/proc=fast cell of RuralEdgeDeconf, which uses an
# identical scenario: timely vitals 72.1%, timely camera 67.9%.
#
# 5 buffer sizes x 30 seeds = 150 runs.
[Config RuralBufferSweep]
extends = RuralBase
repeat = 30
*.rig.camera.messageLength = 60KiB
*.rig.cameraLinkType = "BleLink"
*.rig.obdLinkType = "WiredLink"
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
*.rig.camLink.queueCapacity = ${cambuf=65536, 131072, 262144, 524288, 1048576}B
*.eNodeB[*].mobility.initialX = 10000m / 2 + ancestorIndex(1) * 10000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 10000m, (ancestorIndex(4)+1) * 10000m)
*.ue.mobility.traceFile = "speed55.bonnmotion"
sim-time-limit = (2.0 * 10000 / 15.28 + 60) * 1s

# =====================================================================
# Mechanism decomposition (added 2026-10-06).
#
# The buffer sweep showed that DROPPING protects vitals and BUFFERING does
# not, but BLE does both at once so it cannot separate volume reduction from
# bandwidth limiting. These configs use the WIRED camera link -- no bandwidth
# cap, no link drops -- and reintroduce the mechanisms one at a time through
# the EdgeApp admission gate, which sits before socket.sendTo() and therefore
# before anything is committed to the RLC/PDCP queues.
#
#   none      unrestricted forwarding (reference)
#   drop      token bucket, discard on arrival  -> volume reduction, no delay
#   pace      token bucket, queue and release   -> temporal spreading
#   dropPace  pace + staleness discard          -> combined
#
# drop and pace share cameraRate, so at equal rate they target the same
# admitted volume and differ only in whether the excess is discarded or
# delayed. The camera SOURCE workload is identical in every arm, so admission
# reduction cannot flatter a delivery denominator.
#
# Scenario is identical to the RuralEdgeDeconf cam=wired/obd=wired/proc=fast
# cell, which is the matched reference (timely vitals 72.1%, camera 67.9%).

[Config MechBase]
extends = RuralBase
repeat = 30
*.rig.camera.messageLength = 60KiB
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
*.eNodeB[*].mobility.initialX = 10000m / 2 + ancestorIndex(1) * 10000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 10000m, (ancestorIndex(4)+1) * 10000m)
*.ue.mobility.traceFile = "speed55.bonnmotion"
sim-time-limit = (2.0 * 10000 / 15.28 + 60) * 1s

# unrestricted reference, 30 runs
[Config MechNone]
extends = MechBase
*.ue.app[0].admissionPolicy = "none"

# 3 policies x 3 rates x 30 seeds = 270 runs
[Config MechSweep]
extends = MechBase
*.ue.app[0].admissionPolicy = ${policy="drop","pace","dropPace"}
*.ue.app[0].cameraRate = ${camrate=400,600,800}kbps
*.ue.app[0].cameraBurst = 65536B
*.ue.app[0].cameraQueueCapacity = 262144B
*.ue.app[0].cameraMaxAge = 2s
