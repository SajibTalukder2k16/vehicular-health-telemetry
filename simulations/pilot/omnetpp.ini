# =====================================================================
# Controller pilot: four operating conditions (added 2026-10-07).
#
# The mechanism decomposition established HOW camera admission protects
# vitals. The pilot asks whether an informed policy beats simple ones, which
# needs conditions that exercise different parts of the problem:
#
#   Healthy     plenty of capacity -- does a policy needlessly suppress camera?
#   Congested   steady overload -- can it match a well-tuned static cap?
#   Transient   capacity drops mid-drive, then recovers -- does adaptation pay?
#   Outage      a genuine coverage hole -- does it avoid backlog and recover?
#
# All four use synthetic site layouts, not OpenCellID geometry, so none of
# them makes a claim about real infrastructure. Transient congestion is driven
# by the background generator's volatile periodUl, which is re-evaluated per
# packet and so can depend on simTime().
[General]
network = paperrebuild.simulations.corridorA.CorridorNet
repeat = 10
seed-set = ${repetition}
# ---- random-number stream separation -------------------------------------
# Everything shared rng-0 by default, so a policy that changes how many
# packets are transmitted shifts the global draw order and therefore changes
# when the exponentially-spaced sensors fire. Measured at seed 0 on
# CondCongested the offered workload drifted between policies: vitals
# generated 1370 / 1326 / 1354 and OBD 723 / 697 / 649 for none / dropPace /
# aimd. Comparing policies on different workloads is not a paired comparison.
#
# Giving the exogenous processes their own streams makes sensor generation
# depend only on its own events, which are policy-independent. The channel
# still differs between policies because transmissions differ -- that is
# endogenous and cannot be held fixed.
num-rngs = 5
# Sensor SOURCES get their own stream, separate from the rig's links and
# edge: BleLink's per-PDU error draws and the edge's volatile processingTime
# also consume randomness, so a factor that changes link type or processing
# would otherwise still shift when the sensors fire.
**.rig.wearable.rng-0 = 1
**.rig.camera.rng-0 = 1
**.rig.obd.rng-0 = 1
**.rig.alarm.rng-0 = 1
**.bgUE[*].**.rng-0 = 2                  # background traffic
**.channelModel[*].rng-0 = 3             # radio channel
**.rig.bleWearable.rng-0 = 4             # rig links and edge service
**.rig.camLink.rng-0 = 4
**.rig.obdLink.rng-0 = 4
**.rig.edge.rng-0 = 4

**.routingRecorder.enabled = false

# Vector recording is off for everything EXCEPT the two escalation latencies.
#
# ORDER MATTERS: OMNeT++ takes the FIRST matching configuration key, so the two
# specific entries must precede the catch-all below. Reversed, they are dead
# lines and the vectors silently record nothing -- which is what the corpora in
# results_escalation/ and results_escalation_sr/ did: 600 .vec files each
# holding vector declarations and zero samples (440 MB of nothing per corpus).
#
# WHY: docs/VERIFICATION_FRONTIER.md §1. Time-to-dispatch is per-escalation, and
# the per-run `e2eDelayEvidence:max` scalar can only give the worst escalation
# in each run -- 30 numbers per cell instead of ~140, and no CDF or survival
# curve. These two vectors are what turn that table into a distribution.
#
# WHY NOT ALL VECTORS: measured, 244 MB per run, i.e. ~146 GB for 600 runs.
# These two cost ~400 samples per run.
*.server.app[0].e2eDelayAlarm:vector.vector-recording = true
*.server.app[0].e2eDelayEvidence:vector.vector-recording = true
**.vector-recording = false

*.configurator.config = xmldoc("../corridorA/demo.xml")

**.mobility.constraintAreaMinX = -100m
**.mobility.constraintAreaMinY = -100m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.constraintAreaMaxY = 600m
# the shared speed55 trace spans 0..26 km; sim-time-limit, not the
# constraint area, is what bounds each condition's drive
**.mobility.constraintAreaMaxX = 32000m

**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.eNodeB*.cellularNic.phy.targetBler = 0.004
# ---- retxBSR-Timer: Simu5G's LTE default is not a legal 3GPP value ---------
# LteMacUe.ned:35 sets retxBsrTimer = default(40). Verified against the
# primary document (ETSI TS 136 331 v19.4.0, clause 6.3.2 MAC-MainConfig,
# ASN.1 read out of ts_136331v190400p.pdf), RetxBSR-Timer-r12 is
# {sf320, sf640, sf1280, sf2560, sf5120, sf10240, spare2, spare1}: 40
# subframes is a legal periodicBSR-Timer value and an ILLEGAL retxBSR-Timer
# value. Simu5G's own NR stack already uses the legal minimum
# (NrMacUe.ned:27, retxBsrTimer = default(320)); the LTE stack does not, so
# this ini inherited the illegal one.
#
# This matters because Simu5G models no PUCCH and no Scheduling Request, so
# an empty-buffer UE re-acquires its grant by RACH+BSR and LteMacUe.cc:516
# then prohibits a RAC retry for the whole timer. The timer is therefore a
# floor on the alert's grant-acquisition tail, and 40 is the most flattering
# value in the range: on CondHealthy/ref over 30 seeds the fraction of alerts
# delayed >= 0.5 s is 11.1% at 40, 17.1% at 320, 21.9% at 640, 25.7% at 2560.
#
# Set to the legal minimum, where it now serves its ACTUAL 3GPP purpose as the
# slow backstop rather than as the only re-request path -- see the SR block
# below, which supplies the fast path Simu5G was missing.
#
# NOTE FOR COMPARISONS: every result recorded before 2026-11-08 (19,090 runs
# plus the 600-run Gate A pilot) used retxBsrTimer=40 with no SR path, so their
# ABSOLUTE alert latencies are not comparable with runs made after these lines.
# See docs/PARAMETER_PROVENANCE.md A.4 and docs/GATE_A_RESULT.md.
*.ue.cellularNic.mac.retxBsrTimer = 320

# ---- Scheduling Request: the path stock Simu5G does not model --------------
# Stock Simu5G has no PUCCH and no SR, so an empty-buffer UE could only
# re-request uplink resources through a RAC gated by retxBsrTimer. That made
# grant re-acquisition cost >= 320 ms in any standards-legal configuration,
# against the ~5-10 ms a real UE pays, and it dominated every alert-latency
# number this project produced. The SR path is added in our Simu5G fork
# (LteMacUe.{ned,h,cc}, srPeriod/srProhibitTimer, default 0 = stock
# behaviour, verified byte-identical with the pre-patch binary).
#
# srPeriod = 5 TTIs: the shortest SR periodicity in the main index range,
# sr-ConfigIndex 0-4, per 3GPP TS 36.213 Table 10.1.5-1 "UE-specific SR
# periodicity and subframe offset configuration for subframe-SR" (read from
# the primary: ETSI TS 136 213 V19.5.0 (2026-09), 3GPP TS 36.213 v19.5.0
# Rel-19). The table's full set is 5, 10, 20, 40, 80 ms for indices 0-154,
# plus 2 ms (155-156) and 1 ms (157); 5 ms is the most responsive value that
# does not depend on the Rel-15 short-TTI slot/subslot variants.
#
# srProhibitTimer = 0: legal (TS 36.331 cl. 6.3.2, sr-ProhibitTimer-r9
# INTEGER (0..7), in SR periods) and means no prohibit, so the UE may use
# every SR opportunity. Re-request gate = srPeriod * (srProhibitTimer + 1).
*.ue.cellularNic.mac.srPeriod = 5
*.ue.cellularNic.mac.srProhibitTimer = 0
**.cellularNic.channelModel[0].shadowing = true
**.cellularNic.channelModel[0].fading = true
**.channelControl.pMax = 20mW
**.channelControl.alpha = 2
**.cellularNic.phy.enableHandover = true
*.eNodeB[*].x2App[*].server.localPort = 5000 + ancestorIndex(1)

*.ue.mobility.typename = "BonnMotionMobility"
*.ue.mobility.nodeId = 0
*.ue.numApps = 1
*.ue.app[0].typename = "paperrebuild.apps.EdgeApp"
*.ue.app[0].destAddress = "server"
*.ue.app[0].destPort = 5000
*.server.numApps = 1
*.server.app[0].typename = "paperrebuild.apps.HealthServerApp"
*.server.app[0].localPort = 5000

*.rig.*.pduErrorRate = 0.01
*.rig.targetModule = "CorridorNet.ue.app[0]"
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
# M4 -- edge processing time. The live value below is UNSOURCED and is known
# to be 11-190x too fast. It is retained ONLY so the 1,080 runs already on
# disk stay comparable; it must not be used for an absolute time-to-dispatch.
#
# Sourced alternatives (Kim & Koo, Technologies 2023, 11(1):8, measured total
# processing time for a camera drowsiness pipeline; PARAMETER_PROVENANCE.md
# section A.2). Under C2' edge processing sits INSIDE the dispatch budget, so
# this is a two-level sensitivity factor, not a new default:
#   *.rig.edge.processingTime = 22.73ms    # PC-class  (Beelink Mini PC)
#   *.rig.edge.processingTime = 94.27ms    # embedded  (Jetson Nano)
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.packetSizeUl = intuniform(200B, 1000B)

# ---------------------------------------------------------------- conditions
[Config CondHealthy]
description = "dense sites, light load, small frames -- capacity to spare"
*.numEnb = 6
*.x2Mesh = false
**.cellularNic.channelModel[0].scenario = "URBAN_MACROCELL"
**.cellularNic.channelModel[0].dynamicLos = true
**.channelControl.sat = -100dBm
*.eNodeB[*].mobility.initialX = 500m + ancestorIndex(1) * 1000m
*.ue.mobility.traceFile = "../corridorA/speed55.bonnmotion"
*.ue.servingNodeId = 1
sim-time-limit = 320s
*.eNodeB[0].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].numX2Apps = 2
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"
*.eNodeB[1].x2App[1].client.connectAddress = "eNodeB[2]%x2ppp0"
*.eNodeB[2].numX2Apps = 2
*.eNodeB[2].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[2].x2App[1].client.connectAddress = "eNodeB[3]%x2ppp0"
*.eNodeB[3].numX2Apps = 2
*.eNodeB[3].x2App[0].client.connectAddress = "eNodeB[2]%x2ppp0"
*.eNodeB[3].x2App[1].client.connectAddress = "eNodeB[4]%x2ppp0"
*.eNodeB[4].numX2Apps = 2
*.eNodeB[4].x2App[0].client.connectAddress = "eNodeB[3]%x2ppp0"
*.eNodeB[4].x2App[1].client.connectAddress = "eNodeB[5]%x2ppp0"
*.eNodeB[5].numX2Apps = 1
*.eNodeB[5].x2App[0].client.connectAddress = "eNodeB[4]%x2ppp0"
*.rig.camera.messageLength = 4KiB
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 4
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 1000m, (ancestorIndex(4)+1) * 1000m)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(20ms, 60ms)

[Config CondCongested]
description = "sparse sites, heavy load, large frames -- steady overload"
*.numEnb = 3
*.x2Mesh = false
**.cellularNic.channelModel[0].scenario = "RURAL_MACROCELL"
**.cellularNic.channelModel[0].fixedLos = true
**.channelControl.sat = -104dBm
*.eNodeB[*].mobility.initialX = 5000m + ancestorIndex(1) * 10000m
*.ue.mobility.traceFile = "../corridorA/speed55.bonnmotion"
*.ue.servingNodeId = 1
sim-time-limit = 1369s
*.eNodeB[0].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].numX2Apps = 2
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"
*.eNodeB[1].x2App[1].client.connectAddress = "eNodeB[2]%x2ppp0"
*.eNodeB[2].numX2Apps = 1
*.eNodeB[2].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.rig.camera.messageLength = 60KiB
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 20
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 10000m, (ancestorIndex(4)+1) * 10000m)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(5ms, 15ms)

[Config CondTransient]
description = "capacity falls as the UE crosses a wide cell gap, then recovers"
extends = CondCongested
# Capacity variation is driven by GEOMETRY, not by background load. Simu5G's
# background generator ignores its volatile periodUl entirely -- a 40x change
# in that parameter gives bit-identical results -- so a synthetic load spike
# cannot be built that way. numBgUes does work, but it is structural and
# cannot change mid-run.
#
# Two sites 12 km apart: midway the UE is 6 km from each, inside the ~7 km
# delivery horizon at -104 dBm but deep at cell edge, so throughput collapses
# and recovers without the link ever dropping. That is the regime an adaptive
# policy should exploit and a static cap should not.
*.numEnb = 2
*.eNodeB[2].numX2Apps = 0
*.eNodeB[*].mobility.initialX = 2000m + ancestorIndex(1) * 12000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[0].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].numX2Apps = 1
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"

[Config CondOutage]
description = "sites too far apart to cover the route -- a genuine coverage hole"
extends = CondCongested
# Sites 16 km apart so the -104 dBm horizon (~7 km) leaves a 2 km hole the
# drive must cross. The drive is deliberately SHORT: Simu5G's RMa LOS path
# loss asserts beyond 10 km, and it computes interference from every eNB
# regardless of the delivery horizon, so a long drive puts the far site
# outside model validity and the run dies. At 680 s the vehicle reaches
# 10.4 km, 9.9 km from the first site -- inside the limit for every seed.
#
# An earlier version used sites at 2/18 km with the full 1369 s drive. That
# reached 18.9 km from the first site and asserted, but only on some seeds,
# so the condition was silently seed-fragile rather than reliably broken.
#
# Geometry: outage while 7.5-9.5 km (131 s), then 58 s of observed recovery.
# AoI is still elevated at the cutoff, which the full-horizon calculation in
# analysis/figures_src/_shared.py handles correctly.
*.numEnb = 2
*.eNodeB[2].numX2Apps = 0
*.eNodeB[*].mobility.initialX = 500m + ancestorIndex(1) * 16000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(20ms, 60ms)
*.eNodeB[0].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].numX2Apps = 1
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"
sim-time-limit = 680s

# =====================================================================
# Indoor edge on a CELLULAR backhaul (added 2026-11-18).
#
# WHY THIS CONFIG EXISTS. The indoor control (tools/room_ladder.sh,
# docs/ROOM_LADDER_RESULT.md) compares a WLAN-backhauled room against the
# four cellular conditions, and has to concede that THREE things differ at
# once: access technology, competing traffic, and the observation window. It
# localises the delivery failure to the mobile cellular setting as a whole
# and cannot attribute it to any one cause.
#
# This arm removes two of the three. It is CondHealthy's radio, channel
# scenario, site layout and X2 mesh, with the edge UE held STATIONARY and the
# background load removed, over the room's 300 s window. So:
#
#   vs CondHealthy      same LTE, same channel; differs in mobility, load
#                       and window -> isolates mobility + contention
#   vs RoomMatched5GHz  same stationary edge, no contention, 300 s, same rig;
#                       differs ONLY in the backhaul -> isolates the access
#                       technology, which is the comparison the paper wants
#
# The UE is parked at the BonnMotion trace's own t=0 position, (5.1, -1.6),
# which is 495 m from eNodeB[0]. That is deliberate: it keeps the serving-cell
# geometry identical to CondHealthy's first instant, so the arm introduces no
# new radio question -- an indoor device served by an outdoor macro at a few
# hundred metres is also the realistic deployment for a clinic or a home on
# cellular. URBAN_MACROCELL is kept for the same reason: changing the channel
# scenario would add back a second difference and defeat the point.
[Config CondIndoorLte]
description = "stationary indoor edge on LTE, no competing traffic -- isolates the backhaul from mobility and load"
extends = CondHealthy
# TWO THINGS HAD TO BE GOT RIGHT HERE, AND BOTH FAILED SILENTLY FIRST.
#
# 1. NOT StationaryMobility. That module leaves the UE's position unknown to
#    Simu5G's channel model, so the UE never gets a CQI, never gets an uplink
#    grant, and the server receives exactly ZERO packets -- while the run
#    completes normally and reports success. Verified: with StationaryMobility
#    and everything else at CondHealthy, server.udp packetReceived = 0 against
#    653 for the mobile arm. So the UE keeps BonnMotionMobility and reads a
#    trace that does not move; the mobility module, its nodeId and the whole
#    attach path are then the cellular campaign's, and the only thing that
#    changes is that the position is constant.
#
# 2. WHERE it is parked is a real choice, not a detail. Parking it at the
#    mobile trace's own t=0 point (5.1, -1.6) also delivered ZERO: that point
#    is 495 m from eNodeB[0] at the corridor's edge and simply out of
#    coverage. The mobile UE delivers because it DRIVES INTO coverage. A
#    distance sweep at CondHealthy, 300 s, seed 0 (packets received at the
#    server) settles it:
#
#        0 m: 1067    50 m: 1067    100 m: 1037    200 m: 1045    300 m: 1068
#
#    Coverage is solid across that whole range -- and every one of them beats
#    the mobile arm's 653. 100 m is chosen: an indoor device served by an
#    outdoor macro at 100 m is the realistic deployment, and it avoids
#    claiming an unrealistically perfect 0 m. y = -1.6 m matches the corridor
#    trace, so the UE sits in the same lane the vehicle drives.
*.ue.mobility.traceFile = "../corridorA/stationary.bonnmotion"
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 0
sim-time-limit = 300s
