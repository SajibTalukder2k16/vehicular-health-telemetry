# =====================================================================
# Controller pilot: four operating conditions (added 2026-10-07).
#
# The mechanism decomposition established HOW camera admission protects
# vitals. The pilot asks whether an informed policy beats simple ones, which
# needs conditions that exercise different parts of the problem:
#
#   Healthy     plenty of capacity -- does a policy needlessly suppress camera?
#   Congested   steady overload -- can it match a well-tuned static cap?
#   Transient   capacity drops mid-drive, then recovers -- does adaptation pay?
#   Outage      a genuine coverage hole -- does it avoid backlog and recover?
#
# All four use synthetic site layouts, not OpenCellID geometry, so none of
# them makes a claim about real infrastructure. Transient congestion is driven
# by the background generator's volatile periodUl, which is re-evaluated per
# packet and so can depend on simTime().
[General]
network = paperrebuild.simulations.corridorA.CorridorNet
repeat = 10
seed-set = ${repetition}
# ---- random-number stream separation -------------------------------------
# Everything shared rng-0 by default, so a policy that changes how many
# packets are transmitted shifts the global draw order and therefore changes
# when the exponentially-spaced sensors fire. Measured at seed 0 on
# CondCongested the offered workload drifted between policies: vitals
# generated 1370 / 1326 / 1354 and OBD 723 / 697 / 649 for none / dropPace /
# aimd. Comparing policies on different workloads is not a paired comparison.
#
# Giving the exogenous processes their own streams makes sensor generation
# depend only on its own events, which are policy-independent. The channel
# still differs between policies because transmissions differ -- that is
# endogenous and cannot be held fixed.
num-rngs = 5
# Sensor SOURCES get their own stream, separate from the rig's links and
# edge: BleLink's per-PDU error draws and the edge's volatile processingTime
# also consume randomness, so a factor that changes link type or processing
# would otherwise still shift when the sensors fire.
**.rig.wearable.rng-0 = 1
**.rig.camera.rng-0 = 1
**.rig.obd.rng-0 = 1
**.rig.alarm.rng-0 = 1
**.bgUE[*].**.rng-0 = 2                  # background traffic
**.channelModel[*].rng-0 = 3             # radio channel
**.rig.bleWearable.rng-0 = 4             # rig links and edge service
**.rig.camLink.rng-0 = 4
**.rig.obdLink.rng-0 = 4
**.rig.edge.rng-0 = 4

**.routingRecorder.enabled = false
**.vector-recording = false
*.configurator.config = xmldoc("../corridorA/demo.xml")

**.mobility.constraintAreaMinX = -100m
**.mobility.constraintAreaMinY = -100m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.constraintAreaMaxY = 600m
# the shared speed55 trace spans 0..26 km; sim-time-limit, not the
# constraint area, is what bounds each condition's drive
**.mobility.constraintAreaMaxX = 32000m

**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.eNodeB*.cellularNic.phy.targetBler = 0.004
**.cellularNic.channelModel[0].shadowing = true
**.cellularNic.channelModel[0].fading = true
**.channelControl.pMax = 20mW
**.channelControl.alpha = 2
**.cellularNic.phy.enableHandover = true
*.eNodeB[*].x2App[*].server.localPort = 5000 + ancestorIndex(1)

*.ue.mobility.typename = "BonnMotionMobility"
*.ue.mobility.nodeId = 0
*.ue.numApps = 1
*.ue.app[0].typename = "paperrebuild.apps.EdgeApp"
*.ue.app[0].destAddress = "server"
*.ue.app[0].destPort = 5000
*.server.numApps = 1
*.server.app[0].typename = "paperrebuild.apps.HealthServerApp"
*.server.app[0].localPort = 5000

*.rig.*.pduErrorRate = 0.01
*.rig.targetModule = "CorridorNet.ue.app[0]"
*.rig.cameraLinkType = "WiredLink"
*.rig.obdLinkType = "WiredLink"
*.rig.edge.processingTime = uniform(0.5ms, 2ms)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.packetSizeUl = intuniform(200B, 1000B)

# ---------------------------------------------------------------- conditions
[Config CondHealthy]
description = "dense sites, light load, small frames -- capacity to spare"
*.numEnb = 6
*.x2Mesh = false
**.cellularNic.channelModel[0].scenario = "URBAN_MACROCELL"
**.cellularNic.channelModel[0].dynamicLos = true
**.channelControl.sat = -100dBm
*.eNodeB[*].mobility.initialX = 500m + ancestorIndex(1) * 1000m
*.ue.mobility.traceFile = "../corridorA/speed55.bonnmotion"
*.ue.servingNodeId = 1
sim-time-limit = 320s
*.eNodeB[0].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].numX2Apps = 2
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"
*.eNodeB[1].x2App[1].client.connectAddress = "eNodeB[2]%x2ppp0"
*.eNodeB[2].numX2Apps = 2
*.eNodeB[2].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[2].x2App[1].client.connectAddress = "eNodeB[3]%x2ppp0"
*.eNodeB[3].numX2Apps = 2
*.eNodeB[3].x2App[0].client.connectAddress = "eNodeB[2]%x2ppp0"
*.eNodeB[3].x2App[1].client.connectAddress = "eNodeB[4]%x2ppp0"
*.eNodeB[4].numX2Apps = 2
*.eNodeB[4].x2App[0].client.connectAddress = "eNodeB[3]%x2ppp0"
*.eNodeB[4].x2App[1].client.connectAddress = "eNodeB[5]%x2ppp0"
*.eNodeB[5].numX2Apps = 1
*.eNodeB[5].x2App[0].client.connectAddress = "eNodeB[4]%x2ppp0"
*.rig.camera.messageLength = 4KiB
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 4
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 1000m, (ancestorIndex(4)+1) * 1000m)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(20ms, 60ms)

[Config CondCongested]
description = "sparse sites, heavy load, large frames -- steady overload"
*.numEnb = 3
*.x2Mesh = false
**.cellularNic.channelModel[0].scenario = "RURAL_MACROCELL"
**.cellularNic.channelModel[0].fixedLos = true
**.channelControl.sat = -104dBm
*.eNodeB[*].mobility.initialX = 5000m + ancestorIndex(1) * 10000m
*.ue.mobility.traceFile = "../corridorA/speed55.bonnmotion"
*.ue.servingNodeId = 1
sim-time-limit = 1369s
*.eNodeB[0].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].numX2Apps = 2
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"
*.eNodeB[1].x2App[1].client.connectAddress = "eNodeB[2]%x2ppp0"
*.eNodeB[2].numX2Apps = 1
*.eNodeB[2].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.rig.camera.messageLength = 60KiB
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 20
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].mobility.initialX = uniform(ancestorIndex(4) * 10000m, (ancestorIndex(4)+1) * 10000m)
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(5ms, 15ms)

[Config CondTransient]
description = "capacity falls as the UE crosses a wide cell gap, then recovers"
extends = CondCongested
# Capacity variation is driven by GEOMETRY, not by background load. Simu5G's
# background generator ignores its volatile periodUl entirely -- a 40x change
# in that parameter gives bit-identical results -- so a synthetic load spike
# cannot be built that way. numBgUes does work, but it is structural and
# cannot change mid-run.
#
# Two sites 12 km apart: midway the UE is 6 km from each, inside the ~7 km
# delivery horizon at -104 dBm but deep at cell edge, so throughput collapses
# and recovers without the link ever dropping. That is the regime an adaptive
# policy should exploit and a static cap should not.
*.numEnb = 2
*.eNodeB[2].numX2Apps = 0
*.eNodeB[*].mobility.initialX = 2000m + ancestorIndex(1) * 12000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[0].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].numX2Apps = 1
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"

[Config CondOutage]
description = "sites too far apart to cover the route -- a genuine coverage hole"
extends = CondCongested
# Sites 16 km apart so the -104 dBm horizon (~7 km) leaves a 2 km hole the
# drive must cross. The drive is deliberately SHORT: Simu5G's RMa LOS path
# loss asserts beyond 10 km, and it computes interference from every eNB
# regardless of the delivery horizon, so a long drive puts the far site
# outside model validity and the run dies. At 680 s the vehicle reaches
# 10.4 km, 9.9 km from the first site -- inside the limit for every seed.
#
# An earlier version used sites at 2/18 km with the full 1369 s drive. That
# reached 18.9 km from the first site and asserted, but only on some seeds,
# so the condition was silently seed-fragile rather than reliably broken.
#
# Geometry: outage while 7.5-9.5 km (131 s), then 58 s of observed recovery.
# AoI is still elevated at the cutoff, which the full-horizon calculation in
# analysis/figures_src/_shared.py handles correctly.
*.numEnb = 2
*.eNodeB[2].numX2Apps = 0
*.eNodeB[*].mobility.initialX = 500m + ancestorIndex(1) * 16000m
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].numBgUes = 8
*.eNodeB[*].cellularNic.bgTrafficGenerator[0].bgUE[*].generator.periodUl = uniform(20ms, 60ms)
*.eNodeB[0].numX2Apps = 1
*.eNodeB[0].x2App[0].client.connectAddress = "eNodeB[1]%x2ppp0"
*.eNodeB[1].numX2Apps = 1
*.eNodeB[1].x2App[0].client.connectAddress = "eNodeB[0]%x2ppp0"
sim-time-limit = 680s
